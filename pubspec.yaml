name: heliora
description: "Heliora - explore the Solar System offline. Planet facts, atmospheres and oxygen, in 2D and 3D."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/planet.frag
